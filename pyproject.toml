[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candor"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "flask>=3.1",
    "click>=8.1",
    "pymupdf>=1.24",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "boto3>=1.34",
]

[project.scripts]
candor = "sme_bridge.cli:cli"

[project.optional-dependencies]
vector = ["chromadb>=0.5", "sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/sme_bridge/core/prompts.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/sme_bridge"]
